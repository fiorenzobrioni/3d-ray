# yaml-language-server: $schema=../../docs/reference/scene-schema.json
# Validation scene (PIANO-REVIEW.md, Phase 0): one of each analytic light type
# (point, sphere, area) over a diffuse floor with a diffuse sphere. Checks the
# radiometric conventions of each light (intensity vs radiance) and their NEE.
format_version: 2
validation:
  width: 128
  height: 96
  spp: 1024
  reference_spp: 16384
  runs:
    - { name: d8, depth: 8 }

world:
  sky: { type: "flat", color: [0, 0, 0] }

cameras:
  - position: [0.0, 2.5, 5.0]
    look_at: [0.0, 0.3, 0.0]
    up: [0, 1, 0]
    fov: 40

materials:
  - { id: "floor", type: "lambertian", color: [0.6, 0.6, 0.6] }
  - { id: "ball", type: "lambertian", color: [0.7, 0.5, 0.3] }

entities:
  - { type: "quad", q: [-5, 0, 5], u: [10, 0, 0], v: [0, 0, -10], material: "floor" }
  - { type: "sphere", center: [0, 0.5, 0], radius: 0.5, material: "ball" }

lights:
  - { type: "point", position: [-1.8, 1.5, 0.5], color: [1.0, 0.8, 0.6], intensity: 2.48424 }
  - { type: "sphere", position: [1.8, 1.2, 0.3], radius: 0.25, color: [0.6, 0.8, 1.0], luminance: 4.6315203, shadow_samples: 1 }
  - { type: "area", corner: [-0.5, 2.5, -1.5], u: [1, 0, 0], v: [0, 0, 1], color: [1, 1, 1], luminance: 3, shadow_samples: 1 }
