# yaml-language-server: $schema=../../docs/reference/scene-schema.json
# Validation scene (PIANO-REVIEW.md, Phases 0 and 5): white rough metal spheres
# lit by an emissive panel and a dim sky. White metal (F0 = 1) is the one case
# where 3D-Ray's F82 Fresnel and Mitsuba's conductor coincide exactly, so the
# comparison isolates the GGX lobe, its sampling and its direct lighting.
# Mitsuba has no multiple-scattering lobe: it is turned off here (its energy is
# checked analytically, white furnace = 1, in MetalTests).
format_version: 2
validation:
  width: 128
  height: 96
  spp: 1024
  reference_spp: 4096
  runs:
    - { name: d16, depth: 16 }

world:
  sky: { type: "flat", color: [0.05, 0.05, 0.05] }

cameras:
  - position: [0.0, 1.6, 4.5]
    look_at: [0.0, 0.8, 0.0]
    up: [0, 1, 0]
    fov: 35

materials:
  - { id: "floor", type: "lambertian", color: [0.5, 0.5, 0.5] }
  - { id: "metal-03", type: "metal", color: [1, 1, 1], roughness: 0.3, multiple_scattering: false }
  - { id: "metal-07", type: "metal", color: [1, 1, 1], roughness: 0.7, multiple_scattering: false }
  - { id: "panel", type: "emissive", color: [1, 1, 1], luminance: 8 }

entities:
  - { type: "quad", q: [-4, 0, 4], u: [8, 0, 0], v: [0, 0, -8], material: "floor" }
  - { type: "sphere", center: [-0.85, 0.8, 0], radius: 0.8, material: "metal-03" }
  - { type: "sphere", center: [0.85, 0.8, 0], radius: 0.8, material: "metal-07" }
  - { type: "quad", q: [-1, 3, 1.5], u: [0, 0, -1], v: [2, 0, 0], material: "panel" }  # normal -Y

lights: []
