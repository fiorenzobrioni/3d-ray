# yaml-language-server: $schema=../../docs/reference/scene-schema.json
# Validation scene (PIANO-REVIEW.md, Phase 5): frosted glass (Walter et al.
# 2007, GGX with height-correlated Smith) in front of a bright panel, light
# reaching the floor only through the rough interfaces. Compared with Mitsuba's
# roughdielectric.
format_version: 2
validation:
  width: 128
  height: 96
  spp: 1024
  reference_spp: 4096
  runs:
    - { name: d32, depth: 32 }

world:
  sky: { type: "flat", color: [0.05, 0.05, 0.05] }

cameras:
  - position: [0.0, 1.6, 4.5]
    look_at: [0.0, 0.7, 0.0]
    up: [0, 1, 0]
    fov: 35

materials:
  - { id: "floor", type: "lambertian", color: [0.5, 0.5, 0.5] }
  - { id: "frost-015", type: "dielectric", color: [1, 1, 1], ior: 1.5, roughness: 0.15 }
  - { id: "frost-040", type: "dielectric", color: [1, 1, 1], ior: 1.5, roughness: 0.4 }
  - { id: "panel", type: "emissive", color: [1, 1, 1], luminance: 8 }

entities:
  - { type: "quad", q: [-4, 0, 4], u: [8, 0, 0], v: [0, 0, -8], material: "floor" }
  - { type: "sphere", center: [-0.85, 0.7, 0], radius: 0.7, material: "frost-015" }
  - { type: "sphere", center: [0.85, 0.7, 0], radius: 0.7, material: "frost-040" }
  - { type: "quad", q: [-1.5, 2.6, -1.5], u: [3, 0, 0], v: [0, 0, 1], material: "panel" }  # normal -Y

lights: []
