# yaml-language-server: $schema=../../docs/reference/scene-schema.json
# Validation scene (PIANO-REVIEW.md, Phase 8): a global homogeneous fog,
# slightly coloured, forward scattering, around a small sphere light and a
# point light over a floor. Tests the free flight in an unbounded medium,
# the in-scattered light (the glow round the lights), NEE through the fog
# and the MIS of the phase-sampled rays that reach the sphere light.
# Mitsuba: volpath with the fog as the camera's medium.
format_version: 2
validation:
  width: 128
  height: 96
  spp: 1024
  reference_spp: 4096
  runs:
    - { name: d16, depth: 16 }

world:
  sky: { type: "flat", color: [0.0, 0.0, 0.0] }
  medium:
    type: "homogeneous"
    sigma_a: [0.01, 0.02, 0.03]
    sigma_s: [0.12, 0.10, 0.08]
    phase: "hg"
    g: 0.5

cameras:
  - position: [0.0, 1.3, 5.0]
    look_at: [0.0, 0.8, 0.0]
    up: [0, 1, 0]
    fov: 40

materials:
  - { id: "floor", type: "lambertian", color: [0.6, 0.6, 0.6] }
  - { id: "ball", type: "lambertian", color: [0.7, 0.4, 0.25] }

entities:
  - { type: "quad", q: [-6, 0, 6], u: [12, 0, 0], v: [0, 0, -12], material: "floor" }
  - { type: "sphere", center: [0.7, 0.5, 0], radius: 0.5, material: "ball" }

lights:
  - { type: "sphere", position: [-0.6, 1.4, 0.2], radius: 0.15, color: [1.0, 0.9, 0.75], luminance: 36.4172 }
  - { type: "point", position: [1.5, 2.2, 1.0], color: [0.6, 0.75, 1.0], intensity: 2.2084801 }
