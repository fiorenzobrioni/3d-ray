# yaml-language-server: $schema=../../docs/reference/scene-schema.json
# Validation scene (PIANO-REVIEW.md, Phase 0): white furnace. A clear Disney
# glass sphere fills the frame inside a uniform environment of radiance 1.
# Glass neither absorbs nor emits, so every pixel must read exactly 1.
format_version: 2
validation:
  width: 64
  height: 64
  spp: 1024
  reference_spp: 1024
  analytic_mean: 1.0
  runs:
    - { name: d64, depth: 64 }

world:
  sky: { type: "flat", color: [1, 1, 1] }

cameras:
  - position: [0.0, 0.0, 4.0]
    look_at: [0.0, 0.0, 0.0]
    up: [0, 1, 0]
    fov: 10

materials:
  - { id: "glass", type: openpbr, base_color: [1, 1, 1], specular_roughness: 0.0, transmission_weight: 1.0, transmission_color: [1, 1, 1] }

entities:
  - { type: "sphere", center: [0, 0, 0], radius: 1.0, material: "glass" }

lights: []
