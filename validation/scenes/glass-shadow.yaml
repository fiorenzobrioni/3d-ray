# yaml-language-server: $schema=../../docs/reference/scene-schema.json
# Validation scene (PIANO-REVIEW.md, Phase 0): clear glass sphere on a diffuse
# floor under an emissive panel. The light under the sphere is a caustic
# (L S S D); the default mode's straight-through transparent shadow adds a
# second estimate of it, reference mode leaves it to the path tracer alone.
format_version: 2
validation:
  width: 128
  height: 96
  spp: 2048
  reference_spp: 16384
  runs:
    - { name: d16, depth: 16 }
  extra_modes:
    transparent: ["--transparent-shadows", "on"]

world:
  sky: { type: "flat", color: [0.02, 0.02, 0.02] }

cameras:
  - position: [0.0, 2.2, 3.6]
    look_at: [0.0, 0.4, 0.0]
    up: [0, 1, 0]
    fov: 35

materials:
  - { id: "floor", type: "lambertian", color: [0.7, 0.7, 0.7] }
  - { id: "glass", type: "dielectric", color: [1, 1, 1], ior: 1.5 }
  - { id: "panel", type: "emissive", color: [1, 1, 1], luminance: 12 }

entities:
  - { type: "quad", q: [-4, 0, 4], u: [8, 0, 0], v: [0, 0, -8], material: "floor" }
  - { type: "sphere", center: [0, 0.6, 0], radius: 0.6, material: "glass" }
  - { type: "quad", q: [-0.5, 3, 0.5], u: [0, 0, -1], v: [1, 0, 0], material: "panel" }  # normal -Y

lights: []
