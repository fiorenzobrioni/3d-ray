# yaml-language-server: $schema=../../docs/reference/scene-schema.json
# Veach's multiple-importance test (Veach 1997, fig. 9.3), PIANO-REVIEW.md
# Phase 7: four metal plates from nearly smooth (front) to rough (back) under
# four sphere lights from small and bright to large and dim, all of the same
# power. Light sampling alone is noisy on the smooth plates under the small
# lights, BSDF sampling alone on the rough plates under the large ones; MIS
# must be clean everywhere and, above all, converge to the same image as the
# reference. Single-scattering GGX (multiple_scattering: false), as Mitsuba's
# rough conductor.
format_version: 2
validation:
  width: 192
  height: 108
  spp: 1024
  reference_spp: 16384
  runs:
    - { name: d4, depth: 4 }
  extra_modes:
    power: ["--mis", "power"]

world:
  sky: { type: "flat", color: [0, 0, 0] }

cameras:
  - position: [0.0, 2.0, 12.0]
    look_at: [0.0, 0.0, 0.0]
    up: [0, 1, 0]
    fov: 34

materials:
  - { id: "plate0", type: "metal", preset: "silver", roughness: 0.02, multiple_scattering: false }
  - { id: "plate1", type: "metal", preset: "silver", roughness: 0.07, multiple_scattering: false }
  - { id: "plate2", type: "metal", preset: "silver", roughness: 0.18, multiple_scattering: false }
  - { id: "plate3", type: "metal", preset: "silver", roughness: 0.38, multiple_scattering: false }
  - { id: "backdrop", type: "lambertian", color: [0.2, 0.2, 0.2] }

entities:
  - { type: "quad", q: [-4.0000, -0.9949, 3.7943], u: [8.0000, 0.0000, 0.0000], v: [0.0000, 0.1898, -1.5887], material: "plate0" }
  - { type: "quad", q: [-4.0000, -0.4613, 1.8836], u: [8.0000, 0.0000, 0.0000], v: [0.0000, 0.3226, -1.5671], material: "plate1" }
  - { type: "quad", q: [-4.0000, 0.0674, -0.0346], u: [8.0000, 0.0000, 0.0000], v: [0.0000, 0.4653, -1.5308], material: "plate2" }
  - { type: "quad", q: [-4.0000, 0.5673, -1.9725], u: [8.0000, 0.0000, 0.0000], v: [0.0000, 0.6654, -1.4551], material: "plate3" }
  - { type: "quad", q: [-12, -4, -9], u: [24, 0, 0], v: [0, 0, 22], material: "backdrop" }

lights:
  - { type: "sphere", position: [-4.5, 4.0, -5.0], radius: 0.05, color: [1, 1, 1], luminance: 607.9271, shadow_samples: 1 }
  - { type: "sphere", position: [-1.5, 4.0, -5.0], radius: 0.15, color: [1, 1, 1], luminance: 67.5475, shadow_samples: 1 }
  - { type: "sphere", position: [1.5, 4.0, -5.0], radius: 0.4, color: [1, 1, 1], luminance: 9.4989, shadow_samples: 1 }
  - { type: "sphere", position: [4.5, 4.0, -5.0], radius: 1.0, color: [1, 1, 1], luminance: 1.5198, shadow_samples: 1 }
