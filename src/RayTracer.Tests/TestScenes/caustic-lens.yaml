# yaml-language-server: $schema=../../../docs/reference/scene-schema.json
# Caustic regression scene (kept from the earlier caustic solvers).
#
# A solid glass sphere sits above a diffuse floor, lit by a rectangular area
# light overhead: the sphere focuses the light into a bright spot on the floor
# beneath it, the focused refractive caustic that straight shadow rays cannot
# produce. Render it with --integrator bdpt to see it converge.

format_version: 2
cameras:
  - position: [0, 4.5, 6]
    look_at: [0, 0, 0]
    fov: 40

world:
  sky:
    type: "flat"
    color: [0.0, 0.0, 0.0]
  ground:
    type: "infinite_plane"
    material: "floor"
    point: [0, 0, 0]

entities:
  - name: "glass_ball"
    type: "sphere"
    center: [0, 1.4, 0]
    radius: 1.0
    material: "glass"

lights:
  - type: area
    corner: [-1.2, 6.0, -1.2]
    u: [2.4, 0.0, 0.0]
    v: [0.0, 0.0, 2.4]
    color: [1.0, 1.0, 1.0]
    luminance: 12.0
    shadow_samples: 4

materials:
  - id: "floor"
    type: "lambertian"
    color: [0.7, 0.7, 0.7]
  - id: "glass"
    type: "dielectric"
    ior: 1.5
