# ═══════════════════════════════════════════════════════════════════════════
#  model-formats.yaml - modelli glTF 2.0, PLY e OBJ
#  (PIANO-REVIEW.md, Fase 2)
# ═══════════════════════════════════════════════════════════════════════════
#
#  Un'entità "mesh" legge .obj (con la sua libreria MTL), .gltf, .glb e .ply
#  dalla chiave path. Senza "material" sull'entità valgono i materiali del
#  file (MTL o glTF, tradotti in OpenPBR); "material_overrides" sostituisce
#  per nome un materiale del file con uno della scena; con "material" lo
#  stesso materiale copre tutto il modello.
#
#    - teiera a sinistra: models/teapot-gold.glb con il suo materiale glTF
#      (metallo, base color oro, roughness 0.25);
#    - teiera a destra: lo stesso file, con il materiale "gold" del file
#      sostituito dalla plastica rossa della scena;
#    - toro: models/torus.ply (binario little endian, con le normali), con
#      il materiale dell'entità.
#
#  I due file sono conversioni di models/utah-teapot-low.obj e
#  models/test-torus-mesh.obj.
#
#  Render: -q draft-small
# ═══════════════════════════════════════════════════════════════════════════

world:
  sky:
    type: "gradient"
    zenith_color:  [0.3, 0.4, 0.55]
    horizon_color: [0.85, 0.85, 0.85]
    ground_color:  [0.2, 0.2, 0.2]

camera:
  position: [0, 4.5, -11]
  look_at:  [0, 1.2, 0]
  fov: 36

lights:
  - type: "point"
    position: [4, 8, -6]
    color: [1.0, 0.96, 0.9]
    intensity: 400

materials:
  - id: "floor"
    type: "openpbr"
    base_color: [0.55, 0.55, 0.55]
    specular_roughness: 0.5
  - id: "red_plastic"
    type: "openpbr"
    base_color: [0.7, 0.05, 0.04]
    specular_roughness: 0.2
  - id: "ceramic"
    type: "openpbr"
    base_color: [0.85, 0.85, 0.8]
    specular_roughness: 0.1
    coat_weight: 1.0

entities:
  - type: "infinite_plane"
    point: [0, 0, 0]
    normal: [0, 1, 0]
    material: "floor"

  - name: "teapot-gltf-material"
    type: "mesh"
    path: "../models/teapot-gold.glb"
    translate: [3.2, 0, 0]
    rotate: [0, -30, 0]

  - name: "teapot-overridden"
    type: "mesh"
    path: "../models/teapot-gold.glb"
    material_overrides:
      gold: "red_plastic"
    translate: [-3.2, 0, 0]
    rotate: [0, -30, 0]

  - name: "torus-ply"
    type: "mesh"
    path: "../models/torus.ply"
    material: "ceramic"
    scale: [0.8, 0.8, 0.8]
    rotate: [60, 0, 0]
    translate: [0, 1.5, 1.5]
