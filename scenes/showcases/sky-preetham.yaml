# yaml-language-server: $schema=../../docs/reference/scene-schema.json
# Showcase: physical sky (Preetham / Hosek-Wilkie compatible).
#
# Demonstrates:
#   - Analytical clear-sky daylight model parametrised by turbidity & sun position.
#   - Decoupled PhysicalSun light auto-registered alongside the sky body.
#   - Hestroffer limb-darkening on the disc.
#
# Render: dotnet run -c Release --project src/RayTracer/RayTracer.csproj -- \
#         -i scenes/showcase-sky-preetham.yaml -o renders/preetham.png -w 1280 -H 720 -s 256 -d 6

format_version: 2
world:
  ground:
    type: "infinite_plane"
    material: "ground"
    point: [0, 0, 0]
  sky:
    type: "hosek_wilkie"          # alias of "preetham" — both routes here today
    turbidity: 3.0                # 1 ≈ pristine, 3 ≈ clear, 5 ≈ haze
    ground_albedo: [0.25, 0.25, 0.22]
    exposure: -13.287712
    sun:
      direction: [-0.35, 0.78, 0.52]   # direction TO the sun (world space)
      shadow_samples: 4

cameras:
  - name: "studio"
    position: [0, 1.4, 5.5]
    look_at: [0, 0.8, 0]
    up: [0, 1, 0]
    fov: 35

materials:
  - id: "ground"
    type: openpbr
    base_color: [0.42, 0.40, 0.36]
    specular_roughness: 0.85
    specular_weight: 0.6
  - id: "chrome"
    type: openpbr
    base_color: [0.95, 0.95, 0.95]
    base_metalness: 1.0
    specular_roughness: 0.08
  - id: "matte"
    type: openpbr
    base_color: [0.75, 0.20, 0.20]
    specular_roughness: 0.55
  - id: "glass"
    type: openpbr
    base_color: [0.95, 0.95, 0.95]
    transmission_weight: 1.0
    specular_roughness: 0.02
    transmission_color: [0.95, 0.95, 0.95]

entities:
  - type: "sphere"
    center: [-1.6, 0.7, 0]
    radius: 0.7
    material: "chrome"
  - type: "sphere"
    center: [0, 0.7, 0]
    radius: 0.7
    material: "matte"
  - type: "sphere"
    center: [1.6, 0.7, 0]
    radius: 0.7
    material: "glass"
